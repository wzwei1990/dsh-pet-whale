<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pet-whale desktop</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        /* 空白区域可拖拽窗口；画布本身留给点击交互 */
        -webkit-app-region: drag;
        cursor: grab;
      }
      #stage:active {
        cursor: grabbing;
      }
      #pet {
        -webkit-app-region: no-drag;
        image-rendering: auto;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.25));
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="pet" width="640" height="360"></canvas></div>
    <script type="module" src="/renderer/desktop-renderer.js"></script>
    <script>
      window.addEventListener('contextmenu', (event) => {
        event.preventDefault()
        window.petDesktop?.openMenu?.()
      })
    </script>
  </body>
</html>
